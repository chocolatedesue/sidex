# SideX CNB config (build mirror under mikasans/sidex).
#
# Auto jobs on every main push were removed so CI stays quiet.
# Use GitHub Actions instead:
#   - .github/workflows/cloud-build.yml  (workflow_dispatch or tag v*)
#   - .github/workflows/release.yml      (workflow_dispatch only)
#
# To re-enable a CNB linux release build, restore a `main.push` job from
# upstream chocolatedesue/sidex `.cnb.yml` (linux-x86_64 stage only).

# No automatic CNB pipelines on this mirror.
