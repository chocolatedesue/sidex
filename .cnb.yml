# SideX cloud builds on CNB.
#
#   check          fast validation: frontend bundle + `cargo check --all-targets`
#                  + the cli unit tests. Runs on every push and every PR.
#   linux-x86_64   full release build, packaged into a runnable tar.gz and
#                  published to the `dist/linux-x86_64` branch.
#
# Both jobs need the Tauri Linux stack (webkit2gtk-4.1 / gtk3 / libsoup3) and
# Node 20+ for the frontend: the `rust` image provides the toolchain, the rest
# is installed per run. Cargo talks to the aliyun mirror because crates.io is
# slow from CNB nodes (same trick as the Malgel pipeline).
#
# See docs/CLOUD-BUILD.md for what the artifact contains and how to run it.

main:
  push:
    - name: check
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: rust:1-bookworm
      env:
        CARGO_TERM_COLOR: always
      stages:
        - name: system-deps
          script: |
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              pkg-config build-essential curl ca-certificates \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y -qq nodejs
            echo "--- toolchain ---"
            rustc --version
            node --version
        - name: cargo-mirror
          script: |
            mkdir -p .cargo
            printf '[source.crates-io]\nreplace-with = "mirror"\n\n[source.mirror]\nregistry = "sparse+https://mirrors.aliyun.com/crates.io-index/"\n' > .cargo/config.toml
        - name: npm-ci
          script: npm ci --no-audit --no-fund
        - name: frontend-build
          script: |
            bash scripts/ensure-file-icon-theme.sh
            npm run build
        - name: cargo-check
          script: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
        - name: cargo-test-cli
          script: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cli

    - name: linux-x86_64
      runner:
        tags: cnb:arch:amd64
        cpus: 16
      docker:
        image: rust:1-bookworm
      env:
        DIST_BRANCH: dist/linux-x86_64
        CARGO_TERM_COLOR: always
      stages:
        - name: system-deps
          script: |
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              pkg-config build-essential curl ca-certificates git \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y -qq nodejs
            rustc --version && node --version
        - name: cargo-mirror
          script: |
            mkdir -p .cargo
            printf '[source.crates-io]\nreplace-with = "mirror"\n\n[source.mirror]\nregistry = "sparse+https://mirrors.aliyun.com/crates.io-index/"\n' > .cargo/config.toml
        - name: npm-ci
          script: npm ci --no-audit --no-fund
        - name: frontend-build
          script: |
            bash scripts/ensure-file-icon-theme.sh
            npm run build
        - name: cargo-build
          script: cargo build --locked --release --manifest-path src-tauri/Cargo.toml
        - name: package
          script: |
            set -e
            VERSION=$(node -p "require('./package.json').version")
            NAME="sidex-${VERSION}-linux-x86_64"
            rm -rf dist-pkg && mkdir -p "dist-pkg/${NAME}/bin"
            cp src-tauri/target/release/SideX "dist-pkg/${NAME}/SideX"
            cp scripts/sidex "dist-pkg/${NAME}/bin/sidex"
            chmod +x "dist-pkg/${NAME}/bin/sidex" "dist-pkg/${NAME}/SideX"
            ln -sfn ../SideX "dist-pkg/${NAME}/bin/SideX"
            cp scripts/install-cli.sh "dist-pkg/${NAME}/install-cli.sh"
            chmod +x "dist-pkg/${NAME}/install-cli.sh"
            # Runtime resources the app looks for next to the executable.
            cp -a src-tauri/extension-host "dist-pkg/${NAME}/" 2>/dev/null || true
            cp -a src-tauri/shell-integration "dist-pkg/${NAME}/" 2>/dev/null || true
            cp -a dist "dist-pkg/${NAME}/dist"
            cp docs/CLOUD-BUILD.md "dist-pkg/${NAME}/README.md" 2>/dev/null || true
            ( cd dist-pkg && tar czf "../${NAME}.tar.gz" "${NAME}" )
            ls -lh "${NAME}.tar.gz"
        - name: upload-dist
          script: |
            set -e
            VERSION=$(node -p "require('./package.json').version")
            SRC_DIR="${CNB_BUILD_WORKSPACE:-$PWD}"
            PUSH_URL="https://${CNB_TOKEN_USER_NAME}:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git"
            rm -rf /tmp/distrepo
            git clone -q "$PUSH_URL" /tmp/distrepo
            cd /tmp/distrepo
            git config user.name "$CNB_TOKEN_USER_NAME"
            git config user.email "ci@cnb.cool"
            git checkout -q --orphan tmp-dist-upload
            git rm -rqf . 2>/dev/null || true
            cp -a "$SRC_DIR"/sidex-*.tar.gz ./
            SRC_SHORT=$(git -C "$SRC_DIR" rev-parse --short HEAD 2>/dev/null || echo unknown)
            git add -A
            git commit -qm "dist: linux-x86_64 v$VERSION (src $SRC_SHORT)"
            git push -q origin tmp-dist-upload:"$DIST_BRANCH" --force
            echo "published $(ls sidex-*.tar.gz) to $DIST_BRANCH"

  pull_request:
    - name: check
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: rust:1-bookworm
      env:
        CARGO_TERM_COLOR: always
      stages:
        - name: system-deps
          script: |
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              pkg-config build-essential curl ca-certificates \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y -qq nodejs
            rustc --version && node --version
        - name: cargo-mirror
          script: |
            mkdir -p .cargo
            printf '[source.crates-io]\nreplace-with = "mirror"\n\n[source.mirror]\nregistry = "sparse+https://mirrors.aliyun.com/crates.io-index/"\n' > .cargo/config.toml
        - name: npm-ci
          script: npm ci --no-audit --no-fund
        - name: frontend-build
          script: |
            bash scripts/ensure-file-icon-theme.sh
            npm run build
        - name: cargo-check
          script: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
        - name: cargo-test-cli
          script: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cli
